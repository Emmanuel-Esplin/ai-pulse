[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pulse"
version = "0.1.0"
description = "AI trends lakehouse: Hacker News, Hugging Face and arXiv in one medallion warehouse"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "tenacity>=9",
  # Hardened XML parsing for the arXiv Atom feed.
  "defusedxml>=0.7",
  # Claude for enrichment; 2.x is the current major.
  "anthropic>=2.8,<3",
  "pyarrow>=15",
  # DuckDB 2.0.0 returned wrong results after a bulk insert in nyc-taxi-pipeline.
  "duckdb>=1.1,<2",
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Bedrock enrichment only; kept out of requirements.lock like the other cloud extras.
aws = ["boto3>=1.35", "botocore[crt]"]  # crt: credentials from `aws login`

[tool.setuptools.packages.find]
include = ["ingestion*", "processing*", "enrich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
